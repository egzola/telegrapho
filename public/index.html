<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description"
        content="Telegrapho is a private realtime text sharing tool. Create your own channels and share text between your devices without relying on third-party services.">
    <meta name="application-name" content="Telegrapho">
    <meta name="author" content="egzola">
    <meta name="theme-color" content="#0f1115">
    <link rel="icon" type="image/png" href="icon.png">
    <link href="style.css" rel="stylesheet">

    <title>Telegrapho</title>

</head>

<body>

    <header class="header">
        <div class="brand">
            <img src="logo.png" alt="Telegrapho Logo" class="logo" />

            <div class="title-wrap">
                <div class="title">Telegrapho</div>
                <div class="subtitle">Your sovereign text sharing platform</div>
            </div>
        </div>

        <div class="header-right">
            <div class="channel-wrap">
                <span class="channel-label">Channel</span>
                <input id="channelInput" class="channel-input" type="text" placeholder="any secret word"
                    autocomplete="off">
            </div>

            <div class="live">
                <span class="dot"></span>
                Live Sync
            </div>
        </div>
    </header>

    <main class="container">
        <div class="card">
            <div class="hero">
                <h1>Write or paste text on one device. Instantly receive it across your devices.</h1>
                <p>Private realtime text sync through your own channel.</p>
            </div>

            <div class="textarea-wrap">
                <textarea id="shared" maxlength="100000" placeholder="Disconnected..." readonly></textarea>
                <button id="clearBtn" class="textarea-action-btn clear-btn"
                    title="Clear the textarea and the current channel">
                    ✕
                </button>

                <button id="qrBtn" class="textarea-action-btn qr-btn" title="Generate QR code for the current text">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16"
                        fill="currentColor">

                        <rect x="1" y="1" width="5" height="5" rx="1" />
                        <rect x="2.5" y="2.5" width="2" height="2" fill="#0f1115" />

                        <rect x="10" y="1" width="5" height="5" rx="1" />
                        <rect x="11.5" y="2.5" width="2" height="2" fill="#0f1115" />

                        <rect x="1" y="10" width="5" height="5" rx="1" />
                        <rect x="2.5" y="11.5" width="2" height="2" fill="#0f1115" />

                        <rect x="10" y="10" width="1.5" height="1.5" />
                        <rect x="12" y="10" width="1.5" height="1.5" />
                        <rect x="10" y="12" width="1.5" height="1.5" />
                        <rect x="13.5" y="12" width="1.5" height="1.5" />
                        <rect x="12" y="13.5" width="1.5" height="1.5" />

                    </svg>
                </button>

                <button id="copyBtn" class="textarea-action-btn copy-btn" title="Copy the current text">
                    ⧉
                </button>

                <button id="pasteBtn" class="textarea-action-btn paste-btn"
                    title="Paste text into the textarea from clipboard">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                        <path d="M8 4h8" />
                        <path d="M9 2h6v4H9z" />

                        <rect x="5" y="4" width="14" height="18" rx="2" />

                        <path d="M9 12h6" />
                        <path d="M9 16h4" />

                    </svg>
                </button>

            </div>

            <div class="footer-bar">
                <div class="status" id="statusConnection">
                    <span class="status-dot" id="statusDot"></span>
                    Connected to: <span id="currentChannel">--</span>
                </div>
                <div>Fingerprint: <span id="fingerprint">--</span></div>
            </div>
        </div>
    </main>

    <footer>
        <span>Developed by egzola</span>
        <span class="footer-sep">·</span>
        <button id="donateBtn" class="donate-btn">⚡ Tip with Lightning</button>
    </footer>

    <script src="sweetalert2.js"></script>
    
    <script src="socket.io.min.js"></script>

    
    <script src="qrcode.min.js"></script>

    <script src="script.js"></script>

</body>

</html>
